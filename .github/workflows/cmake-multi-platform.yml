
name: QuantLibAddin Cross-Platform Build

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      # ---------------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ---------------------------------------------------------------
      # Python and build tools
      # ---------------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pybind11 ninja build scikit-build-core

      - name: Display Python configuration
        run: |
          python --version
          python -c "import sys; print(sys.executable)"
          python -m pybind11 --cmakedir

      # ---------------------------------------------------------------
      # Ubuntu dependencies
      # ---------------------------------------------------------------

      - name: Install Boost (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-all-dev

      # ---------------------------------------------------------------
      # macOS dependencies
      # ---------------------------------------------------------------

      - name: Install Boost (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install boost

      # ---------------------------------------------------------------
      # Windows dependencies
      #
      # Install the complete Boost package so headers such as
      # boost/bimap/bimap.hpp are available to QuantLib.
      # ---------------------------------------------------------------

      - name: Install Boost (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install boost:x64-windows

      # ---------------------------------------------------------------
      # Configure CMake: Linux and macOS
      # ---------------------------------------------------------------

      - name: Configure CMake (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')" \
            -DRUN_GENSRC=ON \
            -DBUILD_DOCS=OFF

      # ---------------------------------------------------------------
      # Configure CMake: Windows
      # ---------------------------------------------------------------

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pythonExe = python -c "import sys; print(sys.executable)"

          cmake -S . -B build `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            "-DPython_EXECUTABLE=$pythonExe" `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DRUN_GENSRC=ON `
            -DBUILD_DOCS=OFF

      # ---------------------------------------------------------------
      # Build
      # ---------------------------------------------------------------

      - name: Build QuantLibAddin
        run: |
          cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 2

      # ---------------------------------------------------------------
      # Test
      # ---------------------------------------------------------------

      - name: Run CTest
        run: |
          ctest --test-dir build `
            -C ${{ env.BUILD_TYPE }} `
            --output-on-failure
        shell: pwsh
        if: runner.os == 'Windows'

      - name: Run CTest (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          ctest --test-dir build \
            -C ${{ env.BUILD_TYPE }} \
            --output-on-failure

      # ---------------------------------------------------------------
      # Report
      # ---------------------------------------------------------------

      - name: Build success
        run: echo "Cross-platform build completed successfully!"
